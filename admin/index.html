<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYSKN · Panel Admin</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--red:#A30000;--black:#0a0a0a;--white:#fff;--gray:#F2F2F2;--gray-mid:#e0e0e0;--muted:#888;--muted-light:#bbb;--green:#16a34a;--green-light:#dcfce7;--green-dark:#166534;--orange:#ea580c;--orange-light:#fff7ed;--surface:#fff;--surface2:#fafafa;--ease:cubic-bezier(0.16,1,0.3,1);--shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shadow-md:0 4px 16px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);--shadow-lg:0 20px 60px rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.06);--radius:4px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes toastIn{from{transform:translateY(100%) scale(.95);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}@keyframes toastOut{to{transform:translateY(100%) scale(.95);opacity:0}}@keyframes badgePop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}@keyframes rowSlideIn{from{transform:translateX(-12px);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes cardEntrance{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 rgba(163,0,0,.3)}50%{box-shadow:0 0 0 6px rgba(163,0,0,0)}}
body{font-family:'Inter',sans-serif;background:var(--gray);color:var(--black);min-height:100vh;-webkit-font-smoothing:antialiased}
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:linear-gradient(135deg,#0a0a0a 0%,#1a0000 100%)}
.login-box{background:#fff;padding:3.5rem 3rem;width:100%;max-width:400px;box-shadow:var(--shadow-lg)}
.login-logo{font-size:2.4rem;font-weight:900;letter-spacing:-.05em}
.login-sub{font-size:.58rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.22em;margin-bottom:2.5rem}
.login-box label{display:block;font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.35rem}
.login-box input{width:100%;padding:.8rem 1rem;border:1.5px solid var(--gray-mid);font-size:.85rem;outline:none;margin-bottom:1.1rem;border-radius:var(--radius);background:var(--surface2)}
.btn-login{width:100%;background:var(--black);color:#fff;border:none;padding:1rem;font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.14em;cursor:pointer;border-radius:var(--radius)}
#loginError{color:var(--red);font-size:.7rem;font-weight:800;margin-top:.8rem;display:none}
#adminApp{display:none;min-height:100vh}
.admin-header{background:var(--black);color:#fff;padding:0 2rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;height:60px}
.admin-logo{font-size:1.3rem;font-weight:900;letter-spacing:-.04em;display:flex;align-items:center;gap:.6rem}
.admin-logo-dot{width:7px;height:7px;background:var(--red);border-radius:50%;animation:ringPulse 2s infinite}
.header-right{display:flex;align-items:center;gap:.8rem}
.btn-logout,.btn-lock{background:none;border:1px solid #2a2a2a;color:#888;padding:.4rem 1rem;font-size:.6rem;font-weight:800;text-transform:uppercase;cursor:pointer;border-radius:var(--radius)}
.btn-lock.locked{background:var(--red);border-color:var(--red);color:#fff}
.admin-nav{background:var(--surface);border-bottom:1px solid rgba(0,0,0,.07);padding:0 2rem;display:flex;gap:0;position:sticky;top:60px;z-index:90}
.tab-btn{padding:.9rem 1.6rem;font-size:.64rem;font-weight:800;text-transform:uppercase;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-family:'Inter',sans-serif}
.tab-btn.active{color:var(--black);border-bottom-color:var(--red)}
.tab-badge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;background:var(--red);color:#fff;font-size:.5rem;font-weight:900;border-radius:10px;margin-left:.4rem}
.admin-content{padding:2rem;max-width:1280px;margin:0 auto}
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem;margin-bottom:2rem}
.stat-card{background:var(--surface);padding:1.5rem;border:1px solid rgba(0,0,0,.06);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.stat-num{font-size:1.8rem;font-weight:900}
.stat-label{font-size:.58rem;font-weight:800;text-transform:uppercase;color:var(--muted)}
.section-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid rgba(0,0,0,.07);flex-wrap:wrap;gap:.6rem}
.btn-primary{background:var(--black);color:#fff;border:none;padding:.7rem 1.5rem;font-size:.65rem;font-weight:800;text-transform:uppercase;cursor:pointer;border-radius:var(--radius)}
.btn-outline{background:var(--surface);color:var(--black);border:1.5px solid var(--gray-mid);padding:.5rem 1rem;font-size:.6rem;font-weight:800;text-transform:uppercase;cursor:pointer;border-radius:var(--radius)}
.filter-row{display:flex;gap:.4rem;margin-bottom:1.2rem;flex-wrap:wrap}
.filter-chip{padding:.35rem .9rem;border:1.5px solid var(--gray-mid);background:var(--surface);font-size:.58rem;font-weight:800;text-transform:uppercase;cursor:pointer;border-radius:20px}
.filter-chip.active{background:var(--black);color:#fff;border-color:var(--black)}
.table-wrapper{background:var(--surface);border:1px solid rgba(0,0,0,.06);border-radius:var(--radius);overflow-x:auto}
.product-table{width:100%;border-collapse:collapse;font-size:.78rem;min-width:700px}
.product-table th{text-align:left;padding:.8rem 1rem;font-size:.58rem;font-weight:900;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--gray-mid);background:var(--surface2)}
.product-table td{padding:.9rem 1rem;border-bottom:1px solid rgba(0,0,0,.04)}
.product-thumb{width:44px;height:56px;object-fit:cover;border-radius:var(--radius);cursor:pointer}
.badge{display:inline-block;padding:3px 9px;border-radius:2px;font-size:.52rem;font-weight:900;text-transform:uppercase}
.badge-new{background:var(--red);color:#fff}.badge-sold{background:#111;color:#fff}.badge-avail{background:var(--green-light);color:var(--green-dark)}.badge-reserved{background:var(--orange-light);color:var(--orange)}.badge-pending{background:#fef9c3;color:#854d0e}.badge-completed{background:var(--green-light);color:var(--green-dark)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);width:100%;max-width:860px;max-height:94vh;overflow-y:auto;border-radius:var(--radius);display:flex;flex-direction:column}
.modal-header{padding:1.8rem 2rem 1.5rem;border-bottom:1px solid var(--gray-mid);display:flex;justify-content:space-between;align-items:center}
.modal-body{display:grid;grid-template-columns:1fr 340px}
.modal-form-pane{padding:1.8rem 2rem;border-right:1px solid var(--gray-mid)}
.modal-preview-pane{padding:1.8rem 1.5rem;background:var(--surface2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column;gap:.35rem}
.form-group label{font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
.form-group input,.form-group select,.form-group textarea{padding:.65rem .8rem;border:1.5px solid var(--gray-mid);font-size:.82rem;outline:none;border-radius:var(--radius)}
.cat-toggle,.size-toggle{padding:.35rem .85rem;border:1.5px solid var(--gray-mid);background:var(--surface);font-size:.62rem;font-weight:800;cursor:pointer;border-radius:var(--radius);margin:.2rem}
.cat-toggle.selected,.size-toggle.selected{background:var(--black);color:#fff;border-color:var(--black)}
.img-upload-zone{border:2px dashed var(--gray-mid);padding:1.5rem;text-align:center;cursor:pointer;border-radius:var(--radius);background:var(--surface2);position:relative}
.img-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:.5rem;margin-top:.8rem}
.img-gallery-item{position:relative;aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden}
.img-gallery-item img{width:100%;height:100%;object-fit:cover}
.img-gallery-item .img-remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border:none;width:20px;height:20px;border-radius:50%;cursor:pointer}
.modal-footer{padding:1.2rem 2rem;border-top:1px solid var(--gray-mid);display:flex;gap:.8rem;justify-content:flex-end}
#toast{position:fixed;bottom:2rem;right:2rem;background:var(--black);color:#fff;padding:.9rem 1.5rem;font-size:.68rem;font-weight:800;z-index:500;border-left:3px solid var(--red);display:none}
.preview-card{border:1px solid var(--gray-mid);border-radius:var(--radius);overflow:hidden}
.preview-img-wrap{aspect-ratio:3/4;background:var(--gray-mid);position:relative}
@media(max-width:768px){.modal-body{grid-template-columns:1fr}.admin-content{padding:1rem}.table-wrapper{display:none}.admin-nav{overflow-x:auto}}
</style>
</head>
<body>
<div id="loginScreen"><div class="login-box"><div class="login-logo">ZYSKN</div><div class="login-sub">Panel de Administración</div><label>Email</label><input type="email" id="loginEmail"><label>Contraseña</label><input type="password" id="loginPass" onkeydown="if(event.key==='Enter') doLogin()"><button class="btn-login" onclick="doLogin()">Ingresar al Panel</button><div id="loginError">Email o contraseña incorrectos</div></div></div>
<div id="adminApp">
<div class="admin-header"><div class="admin-logo"><div class="admin-logo-dot"></div>ZYSKN</div><div class="header-right"><span id="adminUserEmail"></span><button class="btn-lock" id="lockBtn" onclick="toggleStoreLock()"><span id="lockLabel">Tienda activa</span></button><button class="btn-logout" onclick="doLogout()">Salir</button></div></div>
<div class="admin-nav">
<button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
<button class="tab-btn" onclick="switchTab('products')">Productos <span class="tab-badge" id="badgeProducts">0</span></button>
<button class="tab-btn" onclick="switchTab('orders')">Pedidos <span class="tab-badge" id="badgeOrders">0</span></button>
<button class="tab-btn" onclick="switchTab('reviews')">Reseñas <span class="tab-badge" id="badgeReviews">0</span></button>
<button class="tab-btn" onclick="switchTab('accounting')">Contabilidad <span class="tab-badge" id="badgeAccounting">0</span></button>
</div>
<div class="admin-content">
<div id="tab-dashboard"><div class="stats-row"><div class="stat-card"><div class="stat-num" id="st-total">-</div><div class="stat-label">Total</div></div><div class="stat-card"><div class="stat-num" id="st-avail">-</div><div class="stat-label">Disponibles</div></div><div class="stat-card"><div class="stat-num" id="st-sold">-</div><div class="stat-label">Vendidas</div></div><div class="stat-card"><div class="stat-num" id="st-orders">-</div><div class="stat-label">Pedidos</div></div></div><div id="recentOrders"></div></div>
<div id="tab-products" style="display:none">
<div class="section-hdr"><h2>Productos <span id="productCountLabel"></span></h2><div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn-outline" onclick="borrarFotosHuerfanas()">🧹 Limpiar fotos</button><button class="btn-outline" onclick="recomprimirTodasLasFotos()">🗜️ 1 Calidad</button><button class="btn-primary" onclick="openProductModal()">+ Agregar Producto</button></div></div>
<div class="filter-row"><button class="filter-chip active" onclick="filterProductsAdmin('all',this)">Todos</button><button class="filter-chip" onclick="filterProductsAdmin('available',this)">Disponibles</button><button class="filter-chip" onclick="filterProductsAdmin('sold',this)">Vendidos</button><button class="filter-chip" onclick="filterProductsAdmin('new',this)">Nuevos</button></div>
<div class="table-wrapper"><table class="product-table"><thead><tr><th>Foto</th><th>Nombre</th><th>Precio</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="productsTableBody"></tbody></table></div>
</div>
<div id="tab-orders" style="display:none"><div id="ordersContainer"></div></div>
<div id="tab-reviews" style="display:none"><div id="reviewsTableBody"></div></div>
<div id="tab-accounting" style="display:none"><div id="accountingTableBody"></div></div>
</div>
</div>

<div class="modal-overlay" id="productModal"><div class="modal"><div class="modal-header"><div id="modalTitle">Nuevo Producto</div><button onclick="closeModal('productModal')">X</button></div><div class="modal-body"><div class="modal-form-pane">
<div class="form-grid">
<div class="form-group form-full"><label>Nombre *</label><input id="f-name"></div>
<div class="form-group"><label>Precio *</label><input type="number" id="f-price"></div>
<div class="form-group"><label>Estado</label><select id="f-estado"><option>10/10</option><option>9/10</option><option>8/10</option></select></div>
<div class="form-group"><label>Sección</label><select id="f-section"><option value="arriba">Arriba</option><option value="abajo">Abajo</option></select></div>
<div class="form-group form-full"><label>Medidas</label><input id="f-medidas"></div>
<div class="form-group form-full"><label>Descripción</label><textarea id="f-desc"></textarea></div>
</div>
<div style="margin-top:1rem"><label>Categorías</label><div id="categoriesGrid"><button type="button" class="cat-toggle" onclick="this.classList.toggle('selected')">remeras</button><button type="button" class="cat-toggle" onclick="this.classList.toggle('selected')">hoodies</button><button type="button" class="cat-toggle" onclick="this.classList.toggle('selected')">pantalones</button></div></div>
<div style="margin-top:1rem"><label>Talles</label><div id="sizesGrid"><button class="size-toggle" onclick="this.classList.toggle('selected')">S</button><button class="size-toggle" onclick="this.classList.toggle('selected')">M</button><button class="size-toggle" onclick="this.classList.toggle('selected')">L</button><button class="size-toggle" onclick="this.classList.toggle('selected')">XL</button></div></div>
<div style="margin-top:1rem"><div class="img-upload-zone" onclick="document.getElementById('f-img-file').click()"><p>Click para subir - Se comprime a 1 calidad automáticamente (1000px WebP 85%)</p><input type="file" id="f-img-file" accept="image/*" multiple style="display:none" onchange="handleFileUpload(event)"></div><div class="img-gallery" id="imgGallery"></div></div>
<div style="margin-top:1rem"><label><input type="checkbox" id="f-new" checked> Nuevo</label> <label><input type="checkbox" id="f-sold"> Vendido</label></div>
</div></div><div class="modal-footer"><button class="btn-outline" onclick="closeModal('productModal')">Cancelar</button><button class="btn-primary" onclick="saveProduct()" id="saveProductBtn">Guardar</button></div></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://iifrudupaxcahnopxqcb.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpZnJ1ZHVwYXhjYWhub3B4cWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NDUyNjgsImV4cCI6MjA5NzAyMTI2OH0.2tTm-ko4n15HctHX40w4_OjBlajaxYZXaqhNamGCD8o';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
let allAdminProducts=[],allOrders=[],allReservations=[],productImages=[],editingProductId=null,previewCurrentImg=0,storeLocked=false,currentUploadFolder=null,productsAdminFilter='all';

sb.auth.onAuthStateChange((e,s)=>{if(s){document.getElementById('loginScreen').style.display='none';document.getElementById('adminApp').style.display='block';initAdmin()}else{document.getElementById('loginScreen').style.display='flex';document.getElementById('adminApp').style.display='none'}});
async function doLogin(){const email=document.getElementById('loginEmail').value,pass=document.getElementById('loginPass').value;const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)document.getElementById('loginError').style.display='block'}
async function doLogout(){await sb.auth.signOut()}
async function initAdmin(){await Promise.all([loadAdminProducts(),loadOrders()]);renderDashboard()}
function switchTab(tab){
 ['dashboard','products','orders','reviews','accounting'].forEach(t=>{const el=document.getElementById('tab-'+t);if(el)el.style.display=t===tab?'block':'none'});
 document.querySelectorAll('.tab-btn').forEach((btn,i)=>{
  btn.classList.toggle('active',['dashboard','products','orders','reviews','accounting'][i]===tab);
 });
 if(tab==='products')renderProductsTable();
 if(tab==='orders')renderOrders();
}
async function loadAdminProducts(){const {data}=await sb.from('products').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:false});allAdminProducts=data||[];document.getElementById('badgeProducts').textContent=allAdminProducts.length}
async function loadOrders(){const {data}=await sb.from('orders').select('*').order('created_at',{ascending:false});allOrders=data||[]}
function getProductImages(p){if(p.images&&Array.isArray(p.images)&&p.images.length)return p.images;const a=[];if(p.img)a.push(p.img);if(p.img2)a.push(p.img2);return a}
function getProductCategories(p){if(p.categories&&Array.isArray(p.categories))return p.categories;if(p.category)return [p.category];return []}

// === 1 CALIDAD RAZONABLE ===
async function compressImage(file){
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
  const maxW=1000;
  let w=img.width,h=img.height;
  if(w>maxW){h=h*(maxW/w);w=maxW}
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  canvas.getContext('2d').drawImage(img,0,0,w,h);
  URL.revokeObjectURL(img.src);
  const blob=await new Promise(r=>canvas.toBlob(r,'image/webp',0.85));
  return new File([blob],file.name.replace(/\.\w+$/,'.webp'),{type:'image/webp'});
}
function renderProductsTable(){
 const list=productsAdminFilter==='all'?allAdminProducts:allAdminProducts.filter(p=>productsAdminFilter==='sold'?p.is_sold:productsAdminFilter==='available'?!p.is_sold:true);
 document.getElementById('productCountLabel').textContent=`(${list.length})`;
 const tbody=document.getElementById('productsTableBody');
 tbody.innerHTML=list.map(p=>{const imgs=getProductImages(p);return `<tr><td>${imgs[0]?`<img src="${imgs[0]}" class="product-thumb">`:'-'} </td><td>${p.name}</td><td>$${Number(p.price).toLocaleString('es-AR')}</td><td>${p.is_sold?'Vendido':'Disponible'}</td><td><button class="btn-outline" onclick="openProductModal('${p.id}')">Editar</button> <button class="btn-outline" onclick="toggleSold('${p.id}',${p.is_sold})">${p.is_sold?'Disp.':'Vendido'}</button> <button class="btn-outline" onclick="confirmDelete('${p.id}')">X</button></td></tr>`}).join('');
}
function filterProductsAdmin(f,btn){productsAdminFilter=f;document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderProductsTable()}
function getSelectedCategories(){return [...document.querySelectorAll('.cat-toggle.selected')].map(b=>b.textContent)}
function renderImgGallery(){const g=document.getElementById('imgGallery');g.innerHTML=productImages.map((it,i)=>`<div class="img-gallery-item"><img src="${it.url}"><button class="img-remove" onclick="productImages.splice(${i},1);renderImgGallery()">x</button></div>`).join('')}

// SUBIDA COMPRIMIDA A 1 CALIDAD
async function handleFileUpload(event){
 const files=Array.from(event.target.files);
 for(const file of files){
  try{
   showToast(`Comprimiendo ${file.name}...`);
   const compressed=await compressImage(file);
   const fileName=`${currentUploadFolder||'products'}/${Date.now()}-${Math.random().toString(36).slice(2,6)}.webp`;
   const {error}=await sb.storage.from('Products').upload(fileName,compressed);
   if(error){showToast(error.message);continue}
   const {data}=sb.storage.from('Products').getPublicUrl(fileName);
   productImages.push({url:data.publicUrl});
   renderImgGallery();
  }catch(e){console.error(e);showToast('Error con '+file.name)}
 }
 event.target.value='';
}

async function borrarFotosHuerfanas(){
 showToast('Buscando huérfanas...');
 const {data,error}=await sb.rpc('get_fotos_huerfanas');
 if(error){showToast(error.message);return}
 const paths=data.map(d=>d.path);
 if(!paths.length){showToast('Limpio, no hay huérfanas');return}
 if(!confirm(`Borrar ${paths.length} fotos huérfanas?`))return;
 for(let i=0;i<paths.length;i+=100){await sb.storage.from('Products').remove(paths.slice(i,i+100))}
 showToast(`Borradas ${paths.length}`);
}

async function recomprimirTodasLasFotos(){
 if(!confirm(`Vas a pasar ${allAdminProducts.length} productos a 1 calidad razonable (1000px WebP 85%). Puede tardar. Continuar?`))return;
 for(const p of allAdminProducts){
  const oldImages=getProductImages(p);if(!oldImages.length)continue;
  showToast(`Recomprimiendo ${p.name}`);
  const newUrls=[],oldPaths=[];
  for(const url of oldImages){
   try{
    const path=url.split('/Products/')[1];if(path)oldPaths.push(path);
    const blob=await (await fetch(url)).blob();
    const compressed=await compressImage(new File([blob],'foto.jpg'));
    const newPath=`${p.id}/${Date.now()}-${Math.random().toString(36).slice(2,5)}.webp`;
    await sb.storage.from('Products').upload(newPath,compressed);
    const {data}=sb.storage.from('Products').getPublicUrl(newPath);
    newUrls.push(data.publicUrl);
   }catch(e){console.error(e)}
  }
  if(newUrls.length){await sb.from('products').update({img:newUrls[0],img2:newUrls[1]||null,images:newUrls}).eq('id',p.id);if(oldPaths.length)await sb.storage.from('Products').remove(oldPaths)}
 }
 showToast('Listo, todo en 1 calidad');location.reload();
}

function openProductModal(id=null){
 editingProductId=id;productImages=[];currentUploadFolder=id||`temp-${Date.now()}`;
 document.getElementById('f-name').value='';document.getElementById('f-price').value='';document.getElementById('imgGallery').innerHTML='';
 if(id){const p=allAdminProducts.find(x=>x.id===id);if(p){document.getElementById('f-name').value=p.name||'';document.getElementById('f-price').value=p.price||'';productImages=getProductImages(p).map(u=>({url:u}));renderImgGallery()}}
 document.getElementById('productModal').classList.add('active');
}
function closeModal(id){document.getElementById(id).classList.remove('active')}
async function saveProduct(){
 const name=document.getElementById('f-name').value.trim(),price=parseFloat(document.getElementById('f-price').value);
 if(!name||!price){showToast('Falta nombre/precio');return}
 const cats=getSelectedCategories();const sizes=[...document.querySelectorAll('.size-toggle.selected')].map(b=>b.textContent);
 const imagesArray=productImages.map(i=>i.url);
 const payload={name,price,categories:cats,category:cats[0]||'remeras',img:imagesArray[0]||null,img2:imagesArray[1]||null,images:imagesArray,is_new:document.getElementById('f-new').checked,is_sold:document.getElementById('f-sold').checked,sizes,estado:document.getElementById('f-estado').value};
 let error;if(editingProductId){({error}=await sb.from('products').update(payload).eq('id',editingProductId))}else{({error}=await sb.from('products').insert(payload))}
 if(error){showToast(error.message);return}
 closeModal('productModal');await loadAdminProducts();renderProductsTable();showToast('Guardado');
}
async function toggleSold(id,cur){await sb.from('products').update({is_sold:!cur}).eq('id',id);await loadAdminProducts();renderProductsTable()}
async function confirmDelete(id){if(!confirm('Eliminar?'))return;await sb.from('products').delete().eq('id',id);await loadAdminProducts();renderProductsTable()}
function renderDashboard(){document.getElementById('st-total').textContent=allAdminProducts.length;document.getElementById('st-avail').textContent=allAdminProducts.filter(p=>!p.is_sold).length;document.getElementById('st-sold').textContent=allAdminProducts.filter(p=>p.is_sold).length;document.getElementById('st-orders').textContent=allOrders.length}
function renderOrders(){document.getElementById('ordersContainer').innerHTML=allOrders.map(o=>`<div>${o.order_id} - $${o.total}</div>`).join('')}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
async function toggleStoreLock(){storeLocked=!storeLocked;showToast(storeLocked?'Bloqueada':'Activa')}
</script>
</body>
